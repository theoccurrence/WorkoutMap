name: WorkoutMap
options:
  bundleIdPrefix: com.theoccurrence
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  WorkoutMap:
    type: application
    platform: iOS
    sources:
      - path: WorkoutMap
        excludes:
          - "Info.plist"
          - "WorkoutMap.entitlements"
          - "*.md"
    settings:
      base:
        PRODUCT_NAME: WorkoutMap
        PRODUCT_BUNDLE_IDENTIFIER: com.theoccurrence.workoutmap
        INFOPLIST_FILE: WorkoutMap/Info.plist
        CODE_SIGN_ENTITLEMENTS: WorkoutMap/WorkoutMap.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        OTHER_LDFLAGS: "$(inherited)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: ""
        CLANG_ENABLE_MODULES: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
    info:
      path: WorkoutMap/Info.plist
      properties:
        CFBundleDisplayName: WorkoutMap
        CFBundleName: WorkoutMap
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        NSHealthShareUsageDescription: "WorkoutMap reads your workouts and their GPS routes from Apple Health to draw your routes on the map."
        NSHealthUpdateUsageDescription: "WorkoutMap does not write any data to Apple Health."
        NSLocationWhenInUseUsageDescription: "WorkoutMap shows your current position on the map."
        NSPhotoLibraryAddUsageDescription: "WorkoutMap saves the workout map you export to your photo library."
        NSPhotoLibraryUsageDescription: "WorkoutMap saves the workout map you export to your photo library."
        NSHumanReadableCopyright: ""
